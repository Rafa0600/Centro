<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe600">
<title>Centro de envío</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#f2f3f5; --card:#fff; --tx:#1d1d1f; --mut:#6b7280; --bd:#e6e8eb; --az:#3483fa; --ok:#2e7d32; --mal:#c62828; --nar:#e65100; --am:#ffe600; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { background:var(--am); padding:calc(8px + env(safe-area-inset-top)) 16px 8px; position:sticky; top:0; z-index:5; }
  .top { display:flex; align-items:center; gap:8px; }
  .top b { font-size:18px; flex:1; }
  .top button { border:0; background:rgba(0,0,0,.08); border-radius:8px; padding:6px 10px; font:600 13px system-ui,sans-serif; color:#1d1d1f; cursor:pointer; }
  #pcs { font-size:12px; font-weight:600; background:rgba(255,255,255,.65); border-radius:12px; padding:3px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw; }
  nav { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; background:rgba(255,255,255,.96); border-top:1px solid var(--bd);
        padding-bottom:env(safe-area-inset-bottom); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  nav button { flex:1; border:0; background:none; padding:7px 2px 8px; font:600 11px system-ui,sans-serif; color:#8a8f98; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; }
  nav button span { font-size:22px; line-height:1; filter:grayscale(1); opacity:.6; }
  nav button.on { color:#1d1d1f; }
  nav button.on span { filter:none; opacity:1; }
  nav button i { position:absolute; top:3px; left:calc(50% + 8px); font-style:normal; background:var(--mal); color:#fff; border-radius:9px; padding:0 6px; font-size:11px; }
  main { max-width:720px; margin:0 auto; padding:12px 16px calc(84px + env(safe-area-inset-bottom)); }
  .card { background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .mut { color:var(--mut); font-size:13px; }
  .big { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:14px; padding:18px; background:var(--az); color:#fff; font:700 17px system-ui,sans-serif; cursor:pointer; }
  .big.ok { background:var(--ok); }
  .btn { border:1px solid var(--bd); background:#fff; border-radius:10px; padding:8px 12px; font:600 14px system-ui,sans-serif; cursor:pointer; color:var(--tx); }
  .btn.rojo { color:var(--mal); border-color:#f3c4c4; }
  input[type=text], input[type=search] { width:100%; border:1px solid var(--bd); border-radius:10px; padding:9px 11px; font:15px system-ui,sans-serif; background:#fff; color:var(--tx); }
  .provs { display:flex; flex-direction:column; }
  .prov { display:flex; align-items:center; gap:9px; padding:8px 4px; border-top:1px solid var(--bd); cursor:pointer; }
  .prov:first-child { border-top:0; }
  .prov.sel { background:#e8f0fe; border-radius:8px; }
  .prov i { width:10px; height:10px; border-radius:50%; flex:0 0 10px; }
  .prov em { font-style:normal; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prov b { font-variant-numeric:tabular-nums; }
  .fila { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--bd); font-size:14px; }
  .fila:first-child { border-top:0; }
  .fila .n { font:500 14px ui-monospace,Consolas,monospace; }
  .fila .n b { font-size:16px; }
  .fila .t { color:var(--mut); font-size:12px; }
  .fila .p { margin-left:auto; color:#fff; border-radius:12px; padding:2px 9px; font-size:12px; font-weight:700; white-space:nowrap; max-width:42%; overflow:hidden; text-overflow:ellipsis; }
  .fila .h { color:var(--mut); font-size:12px; white-space:nowrap; text-align:right; min-width:64px; }
  .fila .h.viejo { color:var(--nar); font-weight:700; }
  .rem { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--bd); }
  .rem input { flex:1; }
  .trab { border-top:1px solid var(--bd); padding:10px 0; cursor:pointer; }
  .trab:first-child { border-top:0; }
  .trab .l1 { display:flex; align-items:center; gap:8px; }
  .trab .l1 b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .est { border-radius:10px; padding:2px 9px; font-size:12px; font-weight:700; white-space:nowrap; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .chip { border-radius:10px; padding:2px 8px; font-size:12px; font-weight:700; }
  .barra { height:6px; background:#e5e7eb; border-radius:3px; overflow:hidden; margin-top:6px; }
  .barra div { height:100%; background:var(--az); transition:width .4s; }
  .det { margin-top:8px; background:#f8f9fb; border-radius:10px; padding:4px 10px; }
  .vacio { text-align:center; color:var(--mut); padding:20px 0; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20; display:none; align-items:center; justify-content:center; padding:16px; }
  #modal > div { background:#fff; border-radius:16px; padding:20px; max-width:420px; width:100%; }
  [hidden] { display:none !important; }
  .pchips { display:flex; flex-wrap:wrap; gap:6px; }
  .pchips span { color:#fff; border-radius:14px; padding:4px 10px; font-size:13px; font-weight:600; cursor:pointer; user-select:none; }
  .pchips span.off { opacity:.35; }
  .dias { display:flex; align-items:center; gap:8px; }
  .dias button { border:1px solid var(--bd); background:#fff; border-radius:10px; width:38px; height:36px; font-size:18px; cursor:pointer; }
  .dias button:disabled { opacity:.3; }
  .dias b { flex:1; text-align:center; font-size:17px; }
  .kpis { display:flex; gap:8px; margin-top:10px; }
  .kpi { flex:1; background:#f6f7f9; border-radius:10px; padding:8px 10px; }
  .kpi b { display:block; font-size:20px; line-height:1.1; white-space:nowrap; }
  .kpi span { font-size:12px; color:var(--mut); }
  .tanda { background:var(--card); border-radius:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.07); overflow:hidden; }
  .tanda .cab { display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; }
  .tanda .cab .hr { font:700 16px system-ui,sans-serif; white-space:nowrap; }
  .tanda .cab .cnt { margin-left:auto; font-weight:800; font-size:16px; }
  .tanda .mini { display:flex; gap:4px; flex-wrap:wrap; flex:1; min-width:0; }
  .tanda .mini span { color:#fff; border-radius:9px; padding:1px 7px; font-size:11px; font-weight:700; white-space:nowrap; }
  .tanda .cuerpo { padding:0 14px 6px; border-top:1px solid var(--bd); }
  .fila.nuevo { animation: nuevo 3s ease-out; }
  .sub { color:var(--mut); margin:4px 4px 6px; font-weight:700; text-transform:uppercase; font-size:12px; }
  .aviso { border-radius:12px; padding:10px 12px; margin-top:10px; font-size:14px; line-height:1.4; }
  .aviso.nar { background:#fff3e0; color:#8a3b00; }
  .aviso.rojo { background:#ffebee; color:#9b1c1c; }
  .aviso.verde { background:#e8f5e9; color:#1b5e20; }
  .aviso b.g { font-size:16px; }
  .tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:12px 0; }
  .tile { border-radius:12px; padding:10px 12px; }
  .tile b { display:block; font-size:28px; line-height:1.05; }
  .tile span { font-size:13px; font-weight:600; }
  .curso { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.07); border-left:5px solid var(--az); }
  .curso .barra { height:12px; border-radius:6px; margin-top:10px; }
  .curso .num { font-size:30px; font-weight:800; line-height:1; }
  .lista-m { max-height:38vh; overflow:auto; background:#f8f9fb; border-radius:10px; padding:2px 10px; margin-top:6px; }
  .trab:active { background:#f6f7f9; }
  .ok-g { color:var(--ok); }
  #modal > div { max-height:88vh; overflow:auto; }
  .big:disabled { opacity:.6; }
  .big.sec { background:#eef1f5; color:var(--tx); }
  @keyframes nuevo { from { background:#fff59d; } to { background:transparent; } }
</style>
</head>
<body>
<header>
  <div class="top"><b>🏬 Centro</b><span id="pcs"></span><button id="instalar" hidden>⬇</button><button id="cfg" title="Clave">⚙</button></div>
</header>
<nav>
  <button data-tab="cen" class="on"><span>📦</span>En el centro</button>
  <button data-tab="rec"><span>📥</span>Recibidos</button>
  <button data-tab="pdf"><span>📄</span>Mandar PDF<i id="activos" hidden></i></button>
</nav>
<main>
  <!-- RECIBIDOS (principal): todo lo que entró, con hora y proveedor, en vivo -->
  <section id="t-rec">
    <div class="card" id="recCab"><div class="vacio">Cargando…</div></div>
    <div class="card" id="recProvs" hidden></div>
    <div id="recTandas"></div>
  </section>

  <!-- MANDAR PDF -->
  <section id="t-pdf" hidden>
    <div id="enCurso"></div>
    <div class="card" id="pdfElegir">
      <label class="big">📄 Elegir PDF de etiquetas<input id="pdfIn" type="file" accept="application/pdf,.pdf" multiple hidden></label>
      <div class="mut" style="margin-top:8px;text-align:center">o desde WhatsApp: compartir ⬆ → <b>Centro</b></div>
    </div>
    <div class="card" id="pdfRes" hidden></div>
    <div class="sub">Mandados</div>
    <div class="card" id="resLista"><div class="vacio">Cargando…</div></div>
  </section>
</main>
<div id="modal"><div></div></div>

<script>
const API = 'https://mikra-historial.rafaelassir.workers.dev/api/';
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsCarga = null;
function cargarPdfJs() {
  return pdfjsCarga = pdfjsCarga || new Promise((ok, mal) => {
    const sc = document.createElement('script'); sc.src = PDFJS + 'pdf.min.js';
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(); };
    sc.onerror = () => { pdfjsCarga = null; mal(new Error('sin conexión')); };
    document.head.appendChild(sc);
  });
}
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// el repo es público: la clave NO va en el código; se pide una vez y queda guardada
const clave = () => ls.get('cen-clave', '') || ls.get('flt-clave', '');
function pedirClave(msg) {
  const k = prompt(msg || 'Clave del Centro de envío (la misma del Lector QR). Se pide una sola vez:');
  if (k && k.trim()) { ls.set('cen-clave', k.trim()); return true; }
  return false;
}
async function api(ruta, body) {
  if (!clave() && !pedirClave()) throw new Error('Falta la clave');
  const r = await fetch(API + ruta, {
    method: body ? 'POST' : 'GET',
    headers: { 'X-Clave': clave(), 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { ls.set('cen-clave', ''); throw new Error('Clave incorrecta (⚙ arriba)'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j;
}
$('#cfg').onclick = () => { if (pedirClave('Cambiar la clave:')) refrescar(); };

/* ---------- utilidades ---------- */
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'], MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const hhmm = (t) => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function diasAtras(t) { const h = new Date(); h.setHours(0, 0, 0, 0); const d = new Date(t); d.setHours(0, 0, 0, 0); return Math.round((h - d) / 86400000); }
function diaTxt(t) { const n = diasAtras(t), d = new Date(t); return n === 0 ? 'Hoy' : n === 1 ? 'Ayer' : DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MES[d.getMonth()]; }
function hace(t, ahora) {
  const s = Math.max(0, Math.round(((ahora || Date.now()) - t) / 1000));
  return s < 60 ? 'hace ' + s + ' s' : s < 3600 ? 'hace ' + Math.round(s / 60) + ' min' : s < 86400 ? 'hace ' + Math.round(s / 3600) + ' h' : diaTxt(t) + ' ' + hhmm(t);
}
function colorProv(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return 'hsl(' + h + ',55%,40%)'; }
const numLindo = (n) => /^\d{11}$/.test(n) ? esc(n.slice(0, -4)) + '<b>' + n.slice(-4) + '</b>' : esc(n);

/* ---------- pestañas ---------- */
let tab = ls.get('cen-tab3', 'cen');
function verTab(t) {
  if (t !== tab) { REC = []; recVistos = null; recFiltro = ''; recBusca = ''; }
  tab = t; ls.set('cen-tab3', t);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  // "En el centro" y "Recibidos" usan la misma pantalla (tandas por hora y proveedor)
  $('#t-rec').hidden = t === 'pdf'; $('#t-pdf').hidden = t !== 'pdf';
  if (t !== 'pdf') {
    const c = recDia === 0 && ls.get('cen-c-' + t, null);
    if (c) { REC = c.lista; STOCK_ACT = c.act || 0; AHORA = Date.now(); recVistos = new Set(REC.map(x => x.id)); pintarRec(); }
    else { $('#recCab').innerHTML = '<div class="vacio">Cargando…</div>'; $('#recProvs').hidden = true; $('#recTandas').innerHTML = ''; }
  }
  window.scrollTo(0, 0);
  if (t === 'pdf') cargarPdfJs().catch(() => {});   // se va bajando mientras elegís el PDF
  refrescar();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => verTab(b.dataset.tab));

/* ---------- PCs conectadas (latido del script) ---------- */
let PCS = [], AHORA = Date.now();
function pcsOnline() { return PCS.filter(p => !/^__/.test(p.pc) && AHORA - p.visto < 70000); }
function pintarPcs() {
  const on = pcsOnline();
  $('#pcs').innerHTML = on.length
    ? '🟢 ' + (on.some(p => p.ocupado) ? 'Escaneando' : on.length === 1 ? esc((on[0].url || '').split(' | ')[0] || 'PC') : on.length + ' PC')
    : '🔴 Sin PC';
  $('#pcs').title = on.map(p => (p.url || '').split(' | ')[0]).join(', ');
}

/* ---------- RECIBIDOS (principal) ---------- */
let REC = [], recDia = 0, recFiltro = '', recBusca = '', recAbiertas = new Set(ls.get('cen-abiertas', [])), recVistos = null;
const inicioDia = (n) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - n); return d.getTime(); };
let STOCK_ACT = 0, STOCK_PC = '', PEDIDO = 0, ultPedido = 0;
// al entrar (o volver a la app) se le pide a la PC con Places abierto que lea la colecta YA
async function pedirActualizar(forzar) {
  if (!forzar && Date.now() - ultPedido < 60000) return;
  ultPedido = Date.now();
  try { const j = await api('places/pedir', {}); PEDIDO = j.pedido; } catch (_) {}
}
async function cargarRec() {
  try {
    let lista;
    if (tab === 'cen') {                     // lo que todavía está en el centro (lista de la colecta que sube la PC)
      if (!STOCK_ACT || Date.now() - STOCK_ACT > 60000) pedirActualizar(false);   // sin esperar
      const j = await api('places/stock'); AHORA = j.ahora; PEDIDO = Math.max(PEDIDO, j.pedido || 0);
      const st = j.stock.find(x => x.tipo === 'collect') || j.stock[0] || null;
      STOCK_ACT = st ? st.actualizado : 0; STOCK_PC = st ? st.pc : '';
      lista = (st ? st.lista : []).filter(x => x.id).map(x => ({ id: x.id, t: x.t || 0, prov: x.prov, tipo: x.tipo })).sort((a, b) => b.t - a.t);
    } else {
      const j = await api('places/recibidos?desde=' + inicioDia(recDia) + '&hasta=' + inicioDia(recDia - 1));
      AHORA = j.ahora; lista = j.lista;
    }
    const antes = recVistos; recVistos = new Set(lista.map(x => x.id));
    REC = lista.map(x => ({ ...x, nuevo: antes && !antes.has(x.id) }));
    if (recDia === 0) ls.set('cen-c-' + tab, { lista, act: STOCK_ACT });
    pintarRec();
  } catch (e) { $('#recCab').innerHTML = '<div class="vacio">⚠ ' + esc(e.message) + '</div>'; }
}
const provDe = (x) => x.prov || (/^M/.test(x.id) ? 'Devoluciones' : 'Sin proveedor');
const colorRec = (k) => k === 'Sin proveedor' ? '#90a4ae' : k === 'Devoluciones' ? '#8d6e63' : colorProv(k);
// tandas: paquetes con 10 min o menos entre uno y otro (igual que en 🕘 Recibidos de la PC)
function tandas(L) {
  const out = [];
  for (const x of L) {                       // L viene de más nuevo a más viejo
    const g = out[out.length - 1];
    if (g && g.desde - x.t <= 10 * 60000) { g.items.push(x); g.desde = x.t; }
    else out.push({ hasta: x.t, desde: x.t, items: [x] });
  }
  return out;
}
function pintarRec() {
  const fecha = new Date(inicioDia(recDia));
  const titulo = recDia === 0 ? 'Hoy' : recDia === 1 ? 'Ayer' : DIAS[fecha.getDay()] + ' ' + fecha.getDate() + ' ' + MES[fecha.getMonth()];
  const cuenta = new Map();
  REC.forEach(x => { const k = provDe(x); cuenta.set(k, (cuenta.get(k) || 0) + 1); });
  const ult = (k) => k === 'Sin proveedor' ? 2 : k === 'Devoluciones' ? 1 : 0;
  const ks = [...cuenta.keys()].sort((a, b) => ult(a) - ult(b) || cuenta.get(b) - cuenta.get(a));
  const ultimo = REC[0];
  if (tab === 'cen') {
    const viejo = REC[REC.length - 1];
    $('#recCab').innerHTML = !STOCK_ACT
      ? '<div class="vacio">Sin datos todavía: abrí Places en una PC.</div>'
      : '<div style="display:flex;align-items:center;gap:8px"><b style="font-size:28px">' + REC.length + '</b><span style="font-size:16px;flex:1">en el centro</span>' +
        (PEDIDO > STOCK_ACT && AHORA - PEDIDO < 180000
          ? '<span class="mut" style="color:var(--az);font-weight:700">⏳ actualizando…</span>'
          : '<span class="mut">' + hace(STOCK_ACT, AHORA) + '</span><button class="btn" id="actYa" style="padding:4px 10px">↻</button>') + '</div>' +
        (PEDIDO > STOCK_ACT && AHORA - PEDIDO >= 180000 ? '<div style="margin-top:4px;color:var(--nar);font-size:13px">⚠ La PC no respondió (Places tiene que estar al frente)</div>' : '') +
        '<div class="kpis"><div class="kpi"><b>' + ks.filter(k => k !== 'Sin proveedor' && k !== 'Devoluciones').length + '</b><span>proveedores</span></div>' +
          '<div class="kpi"><b>' + (viejo && viejo.t ? (diasAtras(viejo.t) ? diaTxt(viejo.t).replace(/^\S+ (?=\d)/, '') : hhmm(viejo.t)) : '—') + '</b><span>el más viejo</span></div>' +
          '<div class="kpi"><b>' + (ultimo && ultimo.t ? hhmm(ultimo.t) : '—') + '</b><span>último</span></div></div>' +
        '<input type="search" id="recBusca" placeholder="🔍 Últimos 4 dígitos" value="' + esc(recBusca) + '" style="margin-top:10px" inputmode="numeric">';
  } else
  $('#recCab').innerHTML =
    '<div class="dias"><button data-d="1">‹</button><b>' + titulo + '</b><button data-d="-1"' + (recDia === 0 ? ' disabled' : '') + '>›</button></div>' +
    '<div class="kpis"><div class="kpi"><b>' + REC.length + '</b><span>recibidos</span></div>' +
      '<div class="kpi"><b>' + (REC.length ? hhmm(REC[REC.length - 1].t) : '—') + '</b><span>primero</span></div>' +
      '<div class="kpi"><b>' + (ultimo ? hhmm(ultimo.t) : '—') + '</b><span>último' + (ultimo && recDia === 0 ? ' · ' + hace(ultimo.t, AHORA).replace('hace ', '') : '') + '</span></div></div>' +
    '<input type="search" id="recBusca" placeholder="🔍 Últimos 4 dígitos" value="' + esc(recBusca) + '" style="margin-top:10px" inputmode="numeric">';
  if ($('#actYa')) $('#actYa').onclick = async () => { await pedirActualizar(true); cargarRec(); };
  if (!$('#recBusca')) { $('#recProvs').hidden = true; $('#recTandas').innerHTML = ''; return; }
  $('#recCab').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { recDia = Math.max(0, recDia + +b.dataset.d); recVistos = null; REC = []; cargarRec(); });
  $('#recBusca').oninput = (e) => { recBusca = e.target.value.replace(/\s/g, ''); pintarTandas(); };
  $('#recProvs').hidden = !REC.length;
  $('#recProvs').innerHTML = '<div class="pchips">' +

async function idsDelPdf(file) {
  await cargarPdfJs();
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const ids = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const items = (await (await doc.getPage(p)).getTextContent()).items;
    const ls = []; let cur = '';
    for (const it of items) { cur += it.str || ''; if (it.hasEOL || it.str === '') { if (cur.trim()) ls.push(cur.trim()); cur = ''; } }
    if (cur.trim()) ls.push(cur.trim());
    let rem = '', buscar = false, antes = ids.length;
    const once = (l) => { const c = l.replace(/\s/g, ''); return /^\d{11}$/.test(c) ? c : ''; };
    ls.forEach((l, i) => {
      const r = l.match(/Remitente\s*#\s*(\d{5,})/i);
      if (r) { rem = r[1]; buscar = true; return; }
      if (/Despachar/i.test(l)) buscar = true;
      if (!buscar) return;
      let c = once(l);
      if (!c && i + 1 < ls.length && /^\d{4,7}$/.test(l.replace(/\s/g, ''))) c = once(l + ls[i + 1]);
      if (c) { ids.push({ id: c, rem }); buscar = false; }
    });
    if (ids.length === antes) { const c = ls.map(once).find(Boolean); if (c) ids.push({ id: c, rem }); }
  }
  return { ids, paginas: doc.numPages };
}

  if (solo) sonar(todoBien);
  if (solo) try { if ('Notification' in window && Notification.permission === 'granted' && document.hidden)
    new Notification(todoBien ? '✅ PDF escaneado' : '⚠ PDF escaneado con avisos', { body: t.nombre + ': ' + ok + ' OK' + (rep ? ', ' + rep + ' ya estaban' : '') + (canc.length ? ', ' + canc.length + ' CANCELADOS' : '') + (err ? ', ' + err + ' con error' : ''), icon: 'icon-192.png' }); } catch (_) {}
  modal('<div style="text-align:center"><div style="font-size:46px;line-height:1.1">' + (canc.length ? '🚨' : todoBien ? '✅' : '⚠') + '</div>' +
      '<div style="font-size:21px;font-weight:800;margin-top:4px">' + (t.estado === 'cancelado' && !t.hechos ? 'Cancelado' : faltan.length ? 'Frenado' : todoBien ? '¡Listo, todo bien!' : 'Terminado con avisos') + '</div>' +
      '<div class="mut">📄 ' + esc(t.nombre) + ' · ' + diaTxt(t.creado) + ' ' + hhmm(t.creado) + '</div></div>' +
    '<div class="tiles">' + tile(ok, 'recibidos OK', '#e8f5e9', '#2e7d32') + tile(rep, 'ya estaban escaneados', '#fff8e1', '#8d6e00') +
      (canc.length ? tile(canc.length, 'CANCELADOS', '#ffebee', '#c62828') : '') + (err ? tile(err, 'con error', '#ffebee', '#c62828') : '') +
      (faltan.length ? tile(faltan.length, 'sin escanear', '#f1f3f5', '#444') : '') + '</div>' +
    (canc.length ? '<div class="aviso rojo"><b class="g">🚨 Separá estos paquetes</b><br>Están cancelados: no van a la colecta, hay que devolverlos.' + lista(canc, '#c62828', 'Cancelado') + '</div>' : '') +
    (err ? '<div class="aviso rojo"><b class="g">⚠ Estos no se pudieron recibir</b><br>Escanealos a mano en la PC.' + lista(malos, '#c62828') + '</div>' : '') +
    (faltan.length ? '<div class="aviso nar"><b class="g">Quedaron ' + faltan.length + ' sin escanear</b> (se frenó antes de terminar).' + lista(faltan, '#666', 'Falta') + '</div>' : '') +
    (rep ? '<details style="margin-top:10px"><summary class="mut">Ver los ' + rep + ' que ya estaban escaneados (no pasa nada)</summary>' + lista(de('repetido'), '#8d6e00', 'Ya estaba') + '</details>' : '') +
    '<div class="mut" style="margin-top:10px;text-align:center">' + (t.pc ? '🖥 ' + esc(nombrePc(t.pc)) : '') + (t.terminado ? ' · tardó ' + Math.max(1, Math.round((t.terminado - (t.tomado || t.creado)) / 60000)) + ' min' : '') + '</div>' +
    '<button class="big" data-m="ok" style="margin-top:14px">Entendido</button>' +
    '<button class="btn" data-m="borrar" style="width:100%;margin-top:8px;color:var(--mut)">🗑 Borrar del historial</button>', async (q) => {
    if (q !== 'borrar' || !confirm('¿Borrar este PDF del historial?')) return;
    try { await api('places/borrar', { id }); } catch (err) { alert(err.message); }
    cargarRes();
  });
}
$('#t-pdf').onclick = async (e) => {
  const c = e.target.closest('[data-cancel]');
  if (c) {
    if (!confirm('¿Frenar este PDF?\nLo que ya se escaneó queda escaneado.')) return;
    try { await api('places/cancelar', { id: +c.dataset.cancel }); } catch (err) { alert(err.message); }
    cargarRes(); return;
  }
  const t = e.target.closest('#resLista [data-t]'); if (t) abrirReporte(+t.dataset.t, false);
};

/* ---------- refresco ---------- */
async function refrescar() {
  if (!clave()) { if (!pedirClave()) return; }
  if (!Object.keys(APODOS).length) api('places/apodos').then(j => { APODOS = j.apodos; }).catch(() => {});
  await Promise.all([cargarRes(), tab !== 'pdf' ? cargarRec() : null]);   // todo a la vez
  revisarCompartidos();
}
let timer = null;
function programar() {
  clearTimeout(timer);
  const activo = TRAB.some(t => t.estado === 'pendiente' || t.estado === 'tomado');
  timer = setTimeout(async () => { if (!document.hidden) await refrescar(); programar(); }, activo ? 4000 : tab === 'pdf' ? 20000 : 10000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar().then(programar); });

/* ---------- instalar como app ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
let pedidoInstalar = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); pedidoInstalar = e; $('#instalar').hidden = false; });
$('#instalar').onclick = async () => { if (!pedidoInstalar) return; pedidoInstalar.prompt(); await pedidoInstalar.userChoice; pedidoInstalar = null; $('#instalar').hidden = true; };

{ const c = ls.get('cen-c-trab', null); if (c) { PCS = c.pcs; TRAB = c.trab; AHORA = c.ahora; pintarPcs(); pintarRes(); AHORA = Date.now(); } }
verTab(tab);
programar();
setTimeout(revisarCompartidos, 800);
</script>
